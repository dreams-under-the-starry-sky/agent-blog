server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: blog-service
  config:
    import: optional:classpath:application-local.yml
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 16MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${BLOG_DB_URL:}
    username: ${BLOG_DB_USERNAME:}
    password: ${BLOG_DB_PASSWORD:}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.blog.entity
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumOrdinalTypeHandler

blog:
  jwt:
    secret: ${BLOG_JWT_SECRET:}
    expire-hours: 24
  upload:
    dir: uploads
    url-prefix: /uploads
  cors:
    origins: http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174
  # 首次启动会把 admin 密码重置为下面的明文，便于本地登录；真实值放 application-local.yml
  admin:
    reset-password: ${BLOG_ADMIN_RESET_PASSWORD:}
  map:
    qq-key: ${BLOG_MAP_QQ_KEY:}
