name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      FRONT_DIR: /www/wwwroot/agent-blog
      ADMIN_DIR: /www/wwwroot/agent-blog-admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build stamp
        run: |
          STAMP=$(TZ=Asia/Shanghai date +%Y%m%d-%H%M%S)
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          echo "本次构建时间戳 $STAMP"

      - name: Build front
        working-directory: Blog
        run: npm ci && npm run build

      - name: Build admin
        working-directory: BlogAdmin
        run: npm ci && npm run build

      - name: Pack timestamped artifacts
        run: |
          printf '%s\n' "$STAMP" > Blog/dist/build-stamp.txt
          printf '%s\n' "$STAMP" > BlogAdmin/dist/build-stamp.txt
          tar -czf "blog-${STAMP}.tar.gz" -C Blog/dist .
          tar -czf "blog-admin-${STAMP}.tar.gz" -C BlogAdmin/dist .

      - name: Upload build packages
        uses: actions/upload-artifact@v4
        with:
          name: agent-blog-${{ env.STAMP }}
          path: |
            blog-${{ env.STAMP }}.tar.gz
            blog-admin-${{ env.STAMP }}.tar.gz

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust host key
        run: |
          HOST="${DEPLOY_HOST:-124.222.86.239}"
          PORT="${DEPLOY_PORT:-22}"
          mkdir -p ~/.ssh
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts

      - name: Upload sites
        run: |
          HOST="${DEPLOY_HOST:-124.222.86.239}"
          PORT="${DEPLOY_PORT:-22}"
          USER="${DEPLOY_USER:?请在仓库 Secrets 中设置 DEPLOY_USER}"
          SSH="ssh -p ${PORT} -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=40"
          rsync -az --delete -e "$SSH" --exclude '.user.ini' --exclude '.htaccess' \
            Blog/dist/ "${USER}@${HOST}:${FRONT_DIR}/"
          rsync -az --delete -e "$SSH" --exclude '.user.ini' --exclude '.htaccess' \
            BlogAdmin/dist/ "${USER}@${HOST}:${ADMIN_DIR}/"
